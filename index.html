<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Eresdé · Tijdregistratie schepen</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f0f4f0;color:#163c2a;font:17px system-ui,-apple-system,sans-serif}header{background:#164a32;color:#fff;padding:24px}header strong{font-size:32px}header p{margin:4px 0 0;font-size:15px}main{max-width:600px;margin:auto;padding:24px 18px}section{background:#fff;border:1px solid #d6e2d7;border-radius:18px;padding:24px}h1{font-size:26px;line-height:1.2;margin:0 0 12px}p{line-height:1.5}nav{display:grid;gap:12px;margin:24px 0}a.boat{display:block;background:#237644;color:#fff;text-decoration:none;border-radius:10px;padding:18px;font-weight:650;min-height:56px}a[hidden]{display:none}a.boat:hover{background:#185e35}a:focus-visible{outline:3px solid #c5a500;outline-offset:4px}.muted{color:#5e7165;font-size:14px}#status{font-weight:600}a.fallback{color:#166537}
  </style>
</head>
<body>
  <header><strong>eresdé</strong><p>Tijdregistratie schepen</p></header>
  <main><section>
    <h1>In- en uitklokken</h1>
    <p id="status" role="status" aria-live="polite">Scan de NFC-pas of QR-code van jouw schip.</p>
    <p><a id="continue" class="boat" hidden>Registratie openen</a></p>
    <p class="muted">Elke scheepspas heeft een eigen link. Je hoeft geen schip te kiezen.</p>
    <noscript><p>Schakel JavaScript in om de scheepspas te openen.</p></noscript>
  </section></main>
  <script>
    'use strict';
    const WEBAPP='https://script.google.com/macros/s/AKfycbzv_8zfNG1_abUs_lz2RXyzdlqi7T39wStOXv26SRSygaa34Y6t39WlkBQWwy2y14TBHw/exec';
    const SCHEPEN={friesland:'MS Friesland',barentsz:'MS Willem Barentsz',vlamingh:'MS Willem de Vlamingh',vlieland:'MS Vlieland'};
    const schip=new URLSearchParams(location.search).get('schip');
    if(schip&&Object.prototype.hasOwnProperty.call(SCHEPEN,schip)){
      const bestemming=new URL(WEBAPP);bestemming.searchParams.set('schip',schip);
      document.getElementById('status').textContent=SCHEPEN[schip]+' wordt geopend…';
      const knop=document.getElementById('continue');knop.href=bestemming.href;knop.hidden=false;knop.textContent=SCHEPEN[schip]+' – verder';
      location.replace(bestemming.href);
    }
  </script>
</body>
</html>
